<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Tiro+Devanagari+Hindi&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
svg{display:block;width:1000px;height:1000px}
.o{display:none}
</style></head><body>

<!-- A: open book, letters fly away as birds -->
<svg id="A" class="o" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <radialGradient id="aBg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#4a1018"/><stop offset=".6" stop-color="#22070b"/><stop offset="1" stop-color="#0b0204"/></radialGradient>
  <radialGradient id="aGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
  <linearGradient id="aPage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3d9"/><stop offset="1" stop-color="#dcbd84"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7dc8f"/><stop offset=".5" stop-color="#d4a640"/><stop offset="1" stop-color="#9c6f1e"/></linearGradient>
  <symbol id="bird" viewBox="0 0 40 20"><path d="M0 14 Q10 0 20 12 Q30 0 40 14 Q30 6 20 16 Q10 6 0 14Z" fill="url(#gold)"/></symbol>
 </defs>
 <rect width="1000" height="1000" fill="url(#aBg)"/>
 <ellipse cx="500" cy="560" rx="330" ry="210" fill="url(#aGlow)"/>
 <!-- birds rising -->
 <g>
  <use href="#bird" x="540" y="400" width="34" height="17" opacity=".95"/>
  <use href="#bird" x="565" y="375" width="42" height="21" opacity=".9"/>
  <use href="#bird" x="470" y="350" width="30" height="15" opacity=".8"/>
  <use href="#bird" x="615" y="300" width="52" height="26" opacity=".85"/>
  <use href="#bird" x="540" y="270" width="36" height="18" opacity=".7"/>
  <use href="#bird" x="680" y="215" width="60" height="30" opacity=".75"/>
  <use href="#bird" x="600" y="185" width="40" height="20" opacity=".55"/>
  <use href="#bird" x="740" y="140" width="48" height="24" opacity=".5"/>
 </g>
 <!-- letters breaking off the page -->
 <g font-family="Tiro Devanagari Hindi" fill="#f3d48a">
  <text x="505" y="470" font-size="30" opacity=".9">क</text>
  <text x="455" y="420" font-size="24" opacity=".7">ह</text>
  <text x="560" y="455" font-size="22" opacity=".6">न</text>
 </g>
 <!-- book -->
 <g stroke="url(#gold)" stroke-width="6" stroke-linejoin="round">
  <path d="M500 520 C420 478 300 470 210 500 L210 650 C300 622 420 630 500 672 Z" fill="url(#aPage)"/>
  <path d="M500 520 C580 478 700 470 790 500 L790 650 C700 622 580 630 500 672 Z" fill="url(#aPage)"/>
  <path d="M200 660 C300 635 420 642 500 690 C580 642 700 635 800 660" fill="none"/>
 </g>
 <g stroke="#b8935a" stroke-width="3" stroke-linecap="round" opacity=".7" fill="none">
  <path d="M250 535 C320 518 400 520 465 545"/><path d="M250 565 C320 548 400 550 465 575"/><path d="M250 595 C320 578 400 580 465 605"/>
  <path d="M535 545 C600 520 680 518 750 535"/><path d="M535 575 C600 550 680 548 750 565"/><path d="M535 605 C600 580 680 578 750 595"/>
 </g>
 <line x1="500" y1="520" x2="500" y2="680" stroke="#9c6f1e" stroke-width="4"/>
 <text x="500" y="805" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="74" fill="url(#gold)" letter-spacing="3">BEYOND WORDS</text>
 <text x="500" y="862" text-anchor="middle" font-family="Tiro Devanagari Hindi" font-size="42" fill="#f3e3c3">हर कहानी में एक हिसाब</text>
</svg>

<!-- B: leather diary with gold BW monogram + pen -->
<svg id="B" class="o" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <radialGradient id="bBg" cx="50%" cy="42%" r="72%"><stop offset="0" stop-color="#173a3f"/><stop offset=".65" stop-color="#0a1c20"/><stop offset="1" stop-color="#040b0d"/></radialGradient>
  <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a2430"/><stop offset="1" stop-color="#4a0e16"/></linearGradient>
  <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe39b"/><stop offset=".5" stop-color="#d6a843"/><stop offset="1" stop-color="#97691a"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".6"/></filter>
 </defs>
 <rect width="1000" height="1000" fill="url(#bBg)"/>
 <g filter="url(#sh)" transform="rotate(-6 500 450)">
  <path d="M610 600 L610 735 L590 715 L570 735 L570 600Z" fill="#c9a24a"/>
  <rect x="318" y="170" width="380" height="500" rx="18" fill="#efe0c0"/>
  <rect x="300" y="160" width="380" height="500" rx="22" fill="url(#leather)"/>
  <rect x="300" y="160" width="46" height="500" rx="22" fill="#00000033"/>
  <rect x="330" y="190" width="320" height="440" rx="12" fill="none" stroke="url(#gold2)" stroke-width="5"/>
  <text x="500" y="465" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="190" fill="url(#gold2)">BW</text>
  <text x="500" y="540" text-anchor="middle" font-family="Tiro Devanagari Hindi" font-size="50" fill="#f4dc9c">हिसाब</text>
 </g>
 <!-- pen -->
 <g transform="translate(40 40) rotate(38 640 560)">
  <rect x="560" y="545" width="300" height="26" rx="13" fill="#141414" stroke="url(#gold2)" stroke-width="4"/>
  <path d="M560 545 L510 558 L560 571Z" fill="url(#gold2)"/>
  <rect x="790" y="541" width="12" height="34" fill="url(#gold2)"/>
 </g>
 <text x="500" y="835" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="70" fill="url(#gold2)" letter-spacing="3">BEYOND WORDS</text>
 <text x="500" y="890" text-anchor="middle" font-family="Tiro Devanagari Hindi" font-size="40" fill="#e9dcc2">रिश्तों की अनकही कहानियाँ</text>
</svg>

<!-- C: typographic, quill underline turning into birds -->
<svg id="C" class="o" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <radialGradient id="cBg" cx="50%" cy="45%" r="72%"><stop offset="0" stop-color="#1b2552"/><stop offset=".6" stop-color="#0b1130"/><stop offset="1" stop-color="#03050f"/></radialGradient>
  <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe39b"/><stop offset=".5" stop-color="#d6a843"/><stop offset="1" stop-color="#97691a"/></linearGradient>
  <linearGradient id="ink" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#d6a843"/><stop offset=".75" stop-color="#d6a843"/><stop offset="1" stop-color="#d6a843" stop-opacity="0"/></linearGradient>
  <symbol id="bird3" viewBox="0 0 40 20"><path d="M0 14 Q10 0 20 12 Q30 0 40 14 Q30 6 20 16 Q10 6 0 14Z" fill="url(#gold3)"/></symbol>
 </defs>
 <rect width="1000" height="1000" fill="url(#cBg)"/>
 <circle cx="500" cy="500" r="430" fill="none" stroke="url(#gold3)" stroke-width="5" opacity=".8"/>
 <circle cx="500" cy="500" r="412" fill="none" stroke="url(#gold3)" stroke-width="1.5" opacity=".6"/>
 <!-- quill -->
 <g>
  <path d="M742 680 C765 590 800 515 850 470 C845 560 810 635 752 690Z" fill="#f3ead6"/>
  <path d="M747 686 C780 600 815 520 850 470" stroke="#c9a24a" stroke-width="3" fill="none"/>
  <path d="M747 686 L732 708" stroke="url(#gold3)" stroke-width="6" stroke-linecap="round"/>
 </g>
 <text x="470" y="470" text-anchor="middle" font-family="Great Vibes" font-size="180" fill="#f4ead2">Beyond</text>
 <text x="460" y="620" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="132" fill="url(#gold3)" letter-spacing="6">WORDS</text>
 <path d="M732 706 C560 712 380 708 200 690" stroke="url(#ink)" stroke-width="7" fill="none" stroke-linecap="round"/>
 <use href="#bird3" x="850" y="400" width="40" height="20"/>
 <use href="#bird3" x="800" y="355" width="32" height="16" opacity=".8"/>
 <use href="#bird3" x="850" y="320" width="26" height="13" opacity=".6"/>
 <text x="480" y="790" text-anchor="middle" font-family="Tiro Devanagari Hindi" font-size="46" fill="#e9dcc2">हर कहानी में एक हिसाब</text>
</svg>

<script>
const o=(location.hash||'#A').slice(1);
document.getElementById(o).style.display='block';
</script>
</body></html>
